# Mantiene activo el proyecto de Supabase (plan gratuito): Supabase pausa los
# proyectos tras 7 días sin uso. Cada 3 días hace una consulta mínima de solo
# lectura que no devuelve datos de nadie.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 13 */3 * *"   # cada 3 días, 7:17 a. m. hora de Ciudad de México
  workflow_dispatch: {}       # permite correrlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .env
          sparse-checkout-cone-mode: false
      - name: Consulta mínima a la base de datos
        run: |
          set -a; . ./.env; set +a
          # RPC pública del portal de padres con un token inexistente: toca la
          # base de datos pero no regresa ningún registro.
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            -X POST "$VITE_SUPABASE_URL/rest/v1/rpc/get_parent_attendance" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $VITE_SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_token":"00000000-0000-0000-0000-000000000000"}')
          echo "HTTP $code — $(cat /tmp/resp.txt)"
          test "$code" = "200"
